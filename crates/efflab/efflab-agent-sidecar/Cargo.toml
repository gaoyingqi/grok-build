# efflab-agent-sidecar：最小 ACP stdio sidecar 的 crate manifest。
# 里程碑：Task 12 S2 入口；根 Cargo.toml 为生成物，member 注册由脚本维护。
[package]
name = "efflab-agent-sidecar"
version = "0.1.0"
description = "Efflab minimal ACP stdio sidecar runtime"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Host 与 sidecar 仅通过无 grok runtime 的共享契约交换版本化 DTO。
efflab-agent-contract = { path = "../efflab-agent-contract" }
# ACP 类型与 gateway 是后续最小 runtime 的直接协议边界；unstable 是 xai-acp-lib 的既定要求。
agent-client-protocol = { workspace = true, features = ["unstable"] }
async-trait = { workspace = true }
xai-acp-lib = { path = "../../codegen/xai-acp-lib" }
anyhow = { workspace = true }
# sidecar 只需 CLI 派生与基础帮助文本；禁止继承 workspace 的 env/color/suggestions。
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
dunce = { workspace = true }
fs2 = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
# Task 2 已验证的最小 HTTP 闭包；不启用默认代理、压缩或其他 transport feature。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
# Task 2 已证明的最小 rmcp streamable HTTP client 闭包；禁止 auth/server/process transport。
rmcp = { version = "2.1", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# 不继承 workspace 的 full feature，避免 process 及其他未使用 Tokio 模块进入闭包。
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "net",
    "time",
    "io-util",
    "io-std",
    "sync",
    "fs",
    "signal",
] }
# ACP 使用 Tokio stdio 与 futures-compatible adapter；不启用 process 或其他完整 feature。
tokio-util = { version = "0.7", default-features = false, features = ["io", "compat"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "smallvec",
    "tracing-log",
    "std",
] }

[dev-dependencies]
# 保留现有合同测试所需的纯数据解析依赖；不恢复旧 runtime。
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
